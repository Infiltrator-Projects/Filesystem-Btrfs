# SPDX-License-Identifier: GPL-3.0-or-later
name: Build and verify hosted and freestanding BTRFS.so
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  btrfs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the independent Btrfs image builder
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends btrfs-progs
      - name: Test native Common V2 interface and corrupted media
        run: |
          set -euo pipefail
          cmake -S . -B build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel 2
          ctest --test-dir build --output-on-failure
          sh tests/check_v2_exports.sh build/BTRFS.so
      - name: Inspect actual installed provider, not test-only legacy worker
        run: |
          set -euo pipefail
          stage="$(mktemp -d)"
          trap 'rm -rf "$stage"' EXIT
          DESTDIR="$stage" cmake --install build
          test "$(find "$stage" -type f | wc -l)" -eq 2
          module="$stage/System/Filesystems/BTRFS.so"
          cmp build/BTRFS.so "$module"
          sh tests/check_v2_exports.sh "$module"
          test -s "$stage/System/Resources/Documentation/Filesystem-Btrfs.pdf"
          test "$(find "$stage" -name '*.ko' | wc -l)" = 0
      - uses: actions/upload-artifact@v4
        with:
          name: BTRFS-hosted-v2-unqualified-for-boot
          path: |
            build/BTRFS.so
            docs/Btrfs.pdf
