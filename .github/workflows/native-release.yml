# Verify both packaged Common V2 namespace readers. Release qualification
# additionally requires the rebuilt BOOT loader and validator.
name: Qualify packaged hosted and freestanding Btrfs readers
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential binutils cmake git pkg-config libssl-dev libsqlite3-dev dpkg-dev btrfs-progs cpio busybox-static
      - name: Build and inspect portable DEB and source-embedded RUN
        run: |
          set -euo pipefail
          python3 standalone/release.py release
          python3 standalone/check-package.py dist/*.deb --profile portable
          test "$(find dist -maxdepth 1 -name '*.deb' | wc -l)" = 1
          test "$(find dist -maxdepth 1 -name '*.run' | wc -l)" = 1
          test "$(find dist -maxdepth 1 -name '*.ko' | wc -l)" = 0
          mkdir -p "$RUNNER_TEMP/portable"
          dpkg-deb -x dist/*.deb "$RUNNER_TEMP/portable"
          test "$(find "$RUNNER_TEMP/portable" -type f | wc -l)" = 2
          sh tests/check_v2_exports.sh "$RUNNER_TEMP/portable/System/Filesystems/BTRFS.so"
          test "$(find "$RUNNER_TEMP/portable" -name '*.ko' | wc -l)" = 0
      - name: Test CPU-native RUN output and final ELF exports
        run: |
          set -euo pipefail
          run_file="$(find dist -maxdepth 1 -name '*.run' -print -quit)"
          bash "$run_file" --profile aggressive --build-only --output "$RUNNER_TEMP/native"
          deb_file="$(find "$RUNNER_TEMP/native" -maxdepth 1 -name '*.deb' -print -quit)"
          test -s "$deb_file"
          python3 standalone/check-package.py "$deb_file" --profile aggressive
          mkdir -p "$RUNNER_TEMP/native-root"
          dpkg-deb -x "$deb_file" "$RUNNER_TEMP/native-root"
          test "$(find "$RUNNER_TEMP/native-root" -type f | wc -l)" = 2
          sh tests/check_v2_exports.sh "$RUNNER_TEMP/native-root/System/Filesystems/BTRFS.so"
          test "$(find "$RUNNER_TEMP/native-root" -name '*.ko' | wc -l)" = 0
      - name: Read disposable media through both packaged carriers and their embedded readers
        shell: bash
        run: |
          set -euo pipefail
          files="$RUNNER_TEMP/btrfs-boot-files"
          bash tests/boot-file-fixtures.sh "$files"
          export BTRFS_TEST_KERNEL="$files/vmlinuz" BTRFS_TEST_INITRAMFS="$files/initramfs"
          check="$RUNNER_TEMP/btrfs-media-check"
          cmake -S . -B "$check" -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build "$check" --target btrfs-readonly-media btrfs-firmware --parallel 2
          for root in "$RUNNER_TEMP/portable" "$RUNNER_TEMP/native-root"; do
            bash tests/readonly_media.sh "$check/btrfs-readonly-media" \
              "$root/System/Filesystems/BTRFS.so" "$check/firmware/BTRFS.so"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: BTRFS-hosted-v2-qualification-only-not-a-BOOT-release
          path: dist/*
          if-no-files-found: error
